name: Publish locked numerical results

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-reported-results.yml"
      - "make_paper_figures.py"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download locked numerical artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage1 /tmp/support /tmp/stage2
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10643402504/zip" -o /tmp/stage1.zip
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10642158182/zip" -o /tmp/support.zip
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10645522176/zip" -o /tmp/stage2.zip
          unzip -q /tmp/stage1.zip -d /tmp/stage1
          unzip -q /tmp/support.zip -d /tmp/support
          unzip -q /tmp/stage2.zip -d /tmp/stage2

      - name: Install plotting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Assemble publication result tree
        run: |
          set -euo pipefail
          mkdir -p reported_results/finite_time
          mkdir -p reported_results/fixed_resource_damping
          mkdir -p reported_results/graph_placement
          mkdir -p reported_results/modal_relaxation
          mkdir -p reported_results/timestep_refinement

          cp "$(find /tmp/stage1 -name 'finite_time_beta_optima.csv' -print -quit)" reported_results/finite_time/beta_optima.csv
          cp "$(find /tmp/stage1 -name 'finite_time_convergence_rates.csv' -print -quit)" reported_results/finite_time/convergence_rates.csv
          cp "$(find /tmp/stage1 -name 'finite_time_horizon_sweep.csv' -print -quit)" reported_results/finite_time/horizon_sweep.csv
          cp "$(find /tmp/stage1 -name 'finite_time_summary.json' -print -quit)" reported_results/finite_time/summary.json
          cp "$(find /tmp/stage1 -name 'finite_time_tolerance_sweep.csv' -print -quit)" reported_results/finite_time/tolerance_sweep.csv

          cp "$(find /tmp/support -name '*damping_support_runs.csv' -print -quit)" reported_results/fixed_resource_damping/runs.csv
          cp "$(find /tmp/support -name '*damping_support_targets.csv' -print -quit)" reported_results/fixed_resource_damping/targets.csv
          cp "$(find /tmp/support -name '*damping_support_summary.csv' -print -quit)" reported_results/fixed_resource_damping/summary.csv
          cp "$(find /tmp/support -name '*damping_support_summary.json' -print -quit)" reported_results/fixed_resource_damping/summary.json

          cp "$(find /tmp/stage2 -name '*graph_boundary_generalization.csv' -print -quit)" reported_results/graph_placement/evaluation.csv
          cp "$(find /tmp/stage2 -name '*graph_random_spectral_pool.csv' -print -quit)" reported_results/graph_placement/random_spectral_pool.csv
          cp "$(find /tmp/stage2 -name '*graph_boundary_strategy_summary.csv' -print -quit)" reported_results/graph_placement/strategy_summary.csv
          cp "$(find /tmp/stage2 -name '*graph_modal_random_percentiles.csv' -print -quit)" reported_results/graph_placement/random_percentiles.csv
          cp "$(find /tmp/stage2 -name '*graph_boundary_generalization_summary.json' -print -quit)" reported_results/graph_placement/summary.json

          cp "$(find /tmp/stage2 -name '*modal_rate_audit.csv' -print -quit)" reported_results/modal_relaxation/audit.csv
          cp "$(find /tmp/stage2 -name '*modal_rate_fits.csv' -print -quit)" reported_results/modal_relaxation/fits.csv
          cp "$(find /tmp/stage2 -name '*modal_rate_summary.json' -print -quit)" reported_results/modal_relaxation/summary.json

          cp "$(find /tmp/stage2 -name '*timestep_refinement.csv' -print -quit)" reported_results/timestep_refinement/audit.csv
          cp "$(find /tmp/stage2 -name '*timestep_refinement_orders.csv' -print -quit)" reported_results/timestep_refinement/orders.csv
          cp "$(find /tmp/stage2 -name '*timestep_refinement_summary.csv' -print -quit)" reported_results/timestep_refinement/summary.csv
          cp "$(find /tmp/stage2 -name '*timestep_refinement_summary.json' -print -quit)" reported_results/timestep_refinement/summary.json

      - name: Generate manuscript figures
        run: |
          python make_paper_figures.py \
            --support-dir reported_results/fixed_resource_damping \
            --graph-dir reported_results/graph_placement \
            --modal-dir reported_results/modal_relaxation \
            --finite-time-dir reported_results/finite_time \
            --timestep-dir reported_results/timestep_refinement \
            --output-dir reported_results/figures

      - name: Write result manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("reported_results")
          files = {}
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "manifest.json":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files[str(path.relative_to(root))] = {
                  "sha256": digest,
                  "bytes": path.stat().st_size,
              }

          manifest = {
              "schema_version": 1,
              "locked_sources": {
                  "finite_time": {
                      "workflow_run": 35609287869,
                      "artifact_id": 10643402504,
                      "artifact_sha256": "24564bcb96878001168b4c5e3d49f889ef0603f224aa604c37600c34ea03b7a8",
                  },
                  "fixed_resource_damping": {
                      "workflow_run": 35607332700,
                      "artifact_id": 10642158182,
                  },
                  "graph_modal_timestep": {
                      "workflow_run": 35609288004,
                      "artifact_id": 10645522176,
                  },
              },
              "files": files,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Commit locked results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reported_results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Publish locked numerical results"
          git push
